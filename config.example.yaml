# Настройки ассистента. Скопируй в config.yaml (это делает install.bat / "assistant init").
# Секреты (ключи, токены) лежат НЕ здесь, а в файле .env

# Часовой пояс, в котором ты работаешь: отчёты, напоминания и время в ответах.
# Примеры: Europe/Moscow, Europe/Kyiv, Asia/Almaty, America/Chicago, America/New_York
# Пусто — часовой пояс компьютера.
timezone: ""

telegram:
  # Какие чаты скачивать и анализировать.
  #   all — ВСЕ чаты аккаунта: личные, группы, Избранное, архивная папка. Новые чаты
  #         (кто-то впервые написал, тебя добавили в группу) подключаются сами.
  #   Или список: числовой ID, @username или название чата (посмотреть: assistant chats)
  chats: all

  # Каналы (новостные, подписки) — обычно это шум и лишние расходы. true — брать и их.
  include_channels: false
  # Чаты с ботами (кроме бота ассистента). true — брать и их.
  include_bots: false
  # «Избранное» (Saved Messages) — твои личные заметки, полезно для «второго я».
  include_saved_messages: true

  # Чаты, которые НЕ скачивать и не анализировать (ID, @username или точное название).
  # Если чат уже скачан — он остаётся на диске, но ассистент перестаёт его видеть, изучать и отслеживать.
  # Служебный чат «Telegram» (коды входа) и @BotFather (токены) исключены всегда.
  # Чтобы добавить: убери «#» в строках ниже (оставь два пробела и дефис).
  exclude_chats:
  #  - "Семья"
  #  - "@some_channel"
  #  - -1001234567890

  # Скачивать ли фото/документы на диск (занимает место). Текст и подписи скачиваются всегда.
  download_media: false
  media_max_mb: 20

  # При запуске перечитывать последние N дней переписки: подтянуть правки и удаления,
  # сделанные, пока программа была выключена. 0 — не перечитывать.
  reconcile_days: 3

  # Доступ к твоему аккаунту — ТОЛЬКО ЧТЕНИЕ. Ассистент технически не может отправлять,
  # редактировать, удалять, пересылать сообщения или отмечать их прочитанными.
  # Общается он только с тобой — через своего бота.

privacy:
  # Прятать номера банковских карт из переписки, прежде чем показывать её Claude
  mask_card_numbers: true

google:
  # service_account — рекомендуется (см. README). oauth — вход своим Google-аккаунтом через браузер.
  auth: service_account
  credentials_file: credentials/google-service-account.json

  sheets:
    - name: "Грузы"
      url: "https://docs.google.com/spreadsheets/d/ВСТАВЬ_ССЫЛКУ/edit"
      # Какие листы читать (пусто = все)
      worksheets: []
      # Подсказка ассистенту: что в таблице (необязательно, но помогает)
      description: "Основная таблица: водители, погрузка, выгрузка, даты, статусы"

    # - name: "Водители"
    #   url: "https://docs.google.com/spreadsheets/d/.../edit"
    #   worksheets: []
    #   description: "Список водителей, траки, телефоны"

claude:
  # Модель. По умолчанию самая умная из основных: claude-opus-5-5.
  # Подешевле: claude-sonnet-5-5 (примерно в 2 раза дешевле).
  model: claude-opus-5-5

  # Модель для фоновой проверки новых сообщений (пусто = та же, что выше)
  watch_model: ""

  # Насколько глубоко думать: low / medium / high / xhigh / max (выше — умнее, но дороже и дольше)
  effort_chat: medium      # ответы в чате
  effort_report: high      # ежедневный отчёт
  effort_learn: high       # изучение истории
  effort_watch: low        # фоновая проверка

  # Если модель отказалась отвечать (редко) — сервер сам повторит запрос на запасной модели
  fallbacks: true

  # Максимум шагов (вызовов инструментов) на один ответ
  max_tool_steps: 30

report:
  enabled: true
  time: "08:00"
  days: [mon, tue, wed, thu, fri, sat, sun]
  # Что должно быть в отчёте — меняй под себя:
  instructions: |
    Сделай ежедневный отчёт по водителям на сегодня.
    1. По каждому водителю: какой сейчас груз, где и когда он закончит (место и время выгрузки), что у него дальше.
    2. Кто освобождается сегодня и завтра — где именно (город/штат) и во сколько, чтобы планировать следующий груз.
    3. Проблемы и риски: опоздания, нет апдейта, проблемы с документами, поломки, жалобы (из переписки за сутки).
    4. Что изменилось в таблицах со вчерашнего дня (коротко, только важное).
    5. Что нужно сделать сегодня: какие апдейты запросить, какие документы отправить и т.д.
    Если у водителей сегодня есть погрузки/выгрузки с конкретным временем — создай напоминания запросить апдейт
    примерно за час (сначала проверь list_reminders, чтобы не дублировать).
    В конце — короткий чек-лист действий на день.

watch:
  # Фоновая проверка: ассистент читает новые сообщения и изменения в таблицах, запоминает важное
  # и пишет тебе, если что-то требует внимания.
  enabled: true
  interval_minutes: 60
  active_hours: "07:00-23:00"
  notify: true

memory:
  # Сколько символов заметок памяти показывать модели в каждом запросе (остальное — через поиск)
  max_prompt_chars: 40000
  # Сколько последних сообщений диалога с тобой держать в разговоре (старые — через поиск)
  dialog_messages: 20
  # Размер куска истории при изучении (learn). Мелкие чаты упаковываются вместе.
  learn_chunk_chars: 120000

learn:
  # Каждую ночь ассистент сам изучает новое за день и пополняет память — ничего не забывает.
  # Начинает работать после того, как ты хотя бы раз запустишь «assistant learn» вручную.
  # Без вопросов изучаются только уже одобренные чаты и небольшие новые; о большой неизученной
  # истории (например, добавили в группу с годами переписки) ассистент напишет и спросит.
  nightly: true
  time: "03:30"
  # Максимум частей за одну ночь (защита от неожиданных расходов). Остальное — в следующие ночи.
  nightly_max_chunks: 20
  # Раз в сколько дней обновлять общий профиль (data/profile.md)
  profile_rebuild_days: 7
